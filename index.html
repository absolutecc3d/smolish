<title>Smolish Video Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* layout: left-aligned column. Oversized wide-set wordmark, then one combined link + download control. */
:root {
  color-scheme: light;
  --bg: #f2f5fb;
  --surface: #ffffff;
  --ink: #0b1430;
  --muted: #5a6685;
  --accent: #1648e8;
  --accent-ink: #ffffff;
  --ok: #0b7a4b;
  --err: #c0261c;
  --f-body: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080d1c; --surface: #10172b; --ink: #e8edff; --muted: #8e9bbd;
    --accent: #5b8cff; --accent-ink: #06102e; --ok: #4fd39a; --err: #ff8e86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080d1c; --surface: #10172b; --ink: #e8edff; --muted: #8e9bbd;
  --accent: #5b8cff; --accent-ink: #06102e; --ok: #4fd39a; --err: #ff8e86;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: clamp(16px, 6vw, 56px);
  padding-block: clamp(32px, 9vh, 104px);
}
.wrap { max-width: 760px; margin: 0; }

h1 { margin: 0 0 clamp(28px, 6vh, 48px); font-weight: 800; text-wrap: balance; }
h1 .brand {
  display: block;
  font-size: clamp(3.4rem, 17vw, 8.4rem);
  line-height: 0.9;
  letter-spacing: -0.045em;
  font-stretch: 125%;
  color: var(--accent);
}
h1 .rest {
  display: block;
  margin-top: 10px;
  font-size: clamp(1.25rem, 4.6vw, 2.1rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-stretch: 125%;
  font-weight: 500;
}

.control {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 6px;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: 16px;
}
.control:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
.control.bad { border-color: var(--err); }
.field { position: relative; flex: 1 1 240px; min-width: 0; }
input[type="text"] {
  width: 100%;
  height: 100%;
  min-height: 56px;
  font: 400 1rem var(--f-mono);
  color: var(--ink);
  background: transparent;
  border: 0;
  outline: 0;
  padding: 0 44px 0 14px;
}
input[type="text"]::placeholder { color: var(--muted); }
.clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; padding: 0;
  background: transparent; color: var(--muted); border: 0; border-radius: 10px;
  font: 400 1.5rem/1 var(--f-body); cursor: pointer;
}
.clear:hover { color: var(--ink); background: var(--bg); }
.clear:focus-visible { outline: 3px solid var(--accent); }

.dl {
  flex: 1 1 170px;
  min-height: 56px;
  padding: 0 28px;
  font: 700 1.05rem var(--f-body);
  letter-spacing: 0.01em;
  color: var(--accent-ink);
  background: var(--accent);
  border: 0;
  border-radius: 11px;
  cursor: pointer;
}
.dl:hover:not(:disabled) { filter: brightness(1.1); }
.dl:active:not(:disabled) { transform: translateY(1px); }
.dl:disabled { cursor: progress; opacity: 0.7; }
.dl:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.msg { min-height: 1.6em; margin: 12px 4px 0; font-size: 0.92rem; color: var(--muted); }
.msg.ok { color: var(--ok); }
.msg.bad { color: var(--err); }

@media (max-width: 480px) { .dl { flex-basis: 100%; } }
@media (prefers-reduced-motion: no-preference) { .dl { transition: filter 0.15s, opacity 0.15s; } }
</style>

<main class="wrap">
  <h1><span class="brand">Smolish</span><span class="rest">Video Downloader</span></h1>

  <form id="f" novalidate>
    <div class="control" id="control">
      <div class="field">
        <input type="text" id="link" name="link" aria-label="Smolish video link" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="https://smolish.com/v/22491588051599360"
               value="https://smolish.com/v/22491588051599360">
        <button type="button" class="clear" id="clear" aria-label="Clear link">&times;</button>
      </div>
      <button type="submit" class="dl" id="dl">Download</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var link = $('link'), clearBtn = $('clear'), control = $('control'), msg = $('msg'), dl = $('dl');
  var busy = false;

  function parse(text) {
    var s = (text || '').trim();
    if (/^\d{6,}$/.test(s)) return s;
    var m = s.match(/smolish\.com\/v\/(\d+)/i);
    return m ? m[1] : null;
  }

  function setMsg(text, cls) { msg.textContent = text; msg.className = 'msg' + (cls ? ' ' + cls : ''); }

  function refresh() {
    var raw = link.value.trim();
    var id = parse(raw);
    clearBtn.hidden = !raw;
    if (id) {
      control.classList.remove('bad'); link.removeAttribute('aria-invalid');
      if (!busy) setMsg('');
    } else if (raw) {
      control.classList.add('bad'); link.setAttribute('aria-invalid', 'true');
      setMsg('That is not a Smolish video link. It should look like https://smolish.com/v/ followed by the video number.', 'bad');
    } else {
      control.classList.remove('bad'); link.removeAttribute('aria-invalid'); setMsg('');
    }
    return id;
  }

  async function download() {
    var id = refresh();
    if (!id || busy) return;
    busy = true; dl.disabled = true; dl.textContent = 'Starting…'; setMsg('');
    try {
      // ask the server first so a missing video shows a clear message
      var res = await fetch('/dl?id=' + id + '&check=1');
      if (res.status === 404) throw new Error('missing');
      if (!res.ok) throw new Error('bad');
      // the server sends the file as an attachment, so the browser saves it directly
      var a = document.createElement('a');
      a.href = '/dl?id=' + id;
      a.download = 'smolish-' + id + '.mp4';
      document.body.appendChild(a); a.click(); a.remove();
      setMsg('Download started. It will appear in your browser downloads.', 'ok');
    } catch (e) {
      if (e && e.message === 'missing') setMsg('That video could not be found. It may be private or removed.', 'bad');
      else if (e && e.message === 'bad') setMsg('The CDN did not return the video. Try again in a moment.', 'bad');
      else setMsg('Could not reach the downloader. Make sure server.js is running and open the page through it.', 'bad');
    } finally {
      busy = false; dl.disabled = false; dl.textContent = 'Download';
    }
  }

  $('f').addEventListener('submit', function (ev) { ev.preventDefault(); download(); });
  link.addEventListener('input', refresh);
  clearBtn.addEventListener('click', function () { link.value = ''; refresh(); link.focus(); });
  refresh();
})();
</script>
